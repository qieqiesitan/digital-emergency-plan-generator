name: CI

on:
  push:
    branches: ["master", "main", "codex/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # 单测不连真实数据库；这里给一个强密钥满足 config 校验
      SECRET_KEY: ci-only-secret-key-0123456789abcdefghijklmnopqrstuvwxyz
      ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff (F/B/S focused gate)
        run: python -m ruff check app tests
      - name: Pytest
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # 与 frontend/Dockerfile 保持一致（Node 22）：PWA/产物必须可复现，
      # Node>=24 时 vite-plugin-pwa 会因 workbox 兼容性跳过 PWA（见 vite.config.ts）
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Unit tests
        run: npx vitest run
      # 历史遗留：246 条 eslint error（@ts-nocheck 26 个文件、no-explicit-any 等）
      # 已列入 W3 前端专项收敛，先不阻塞流水线，但每次都会输出当前数量
      - name: ESLint (non-blocking, tracked debt)
        continue-on-error: true
        run: npx eslint .
