# 生产部署 compose（后端栈）
# 用法：cp .env.example .env（必须修改 SECRET_KEY / POSTGRES_PASSWORD）&& docker compose -f deploy/docker-compose.prod.yml --project-directory . up -d --build
# 注意：`db-init/`（数据库恢复 SQL）与 `model-cache/chroma/`（ONNX 模型缓存）由部署者提供，
# 缺目录时 docker 会静默创建空目录，必须放置真实数据。
# 拓扑：公司网关 nginx 托管前端静态 + 反代 /api /uploads，本文件只启 postgres + backend。
# 如需自托管前端（开发/无网关形态），参考根 docker-compose.yml 的 frontend/shuzihuayuan 服务。
services:
  postgres:
    # 勿改回 postgres:16-alpine：CentOS 7 XFS+overlay2 卷挂载 initdb 报 Operation not permitted
    image: postgres:16
    container_name: emergency-plan-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 中设置}
      POSTGRES_DB: emergency_plan
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emergency-plan-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/emergency_plan
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 必须在 .env 中设置}
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-abcdefghijklmnopqrstuvwxyz123456}
      EXPORT_DIR: /app/exports
      EXTERNAL_API_HMAC_SECRET: ${EXTERNAL_API_HMAC_SECRET:-}
      PROTEGO_CALLBACK_URL: ${PROTEGO_CALLBACK_URL:-}
      QCC_API_KEY: ${QCC_API_KEY:-}
      QCC_ENDPOINT: ${QCC_ENDPOINT:-https://agent.qcc.com/mcp/company/stream}
      QCC_API_KEY_FALLBACK: ${QCC_API_KEY_FALLBACK:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend/exports:/app/exports
      - ./backend/uploads:/app/uploads
      - ./model-cache/chroma:/root/.cache/chroma
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
