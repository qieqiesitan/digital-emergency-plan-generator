services:
  postgres:
    image: postgres:16-alpine
    container_name: emergency-plan-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emergency_plan
    ports:
      - "5438:5432"
    volumes:
      - shuzihuayuan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emergency-plan-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/emergency_plan
      SECRET_KEY: emergency-plan-docker-secret-key-2026
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      ENCRYPTION_KEY: abcdefghijklmnopqrstuvwxyz123456
      EXPORT_DIR: /app/exports
      QCC_API_KEY: Bearer M6cf4mymxeKxHtSlXSXr7EfrA5IwHahRZXSNqVfqxtgv2slL
      QCC_ENDPOINT: https://agent.qcc.com/mcp/company/stream
      QCC_API_KEY_FALLBACK: Bearer MKa5gXuIusMXXoCPPCAzW4uM34ZmVc1BldVraKDkhSmqeNKF
    ports:
      - "8000:8000"
    volumes:
      - ./backend/exports:/app/exports
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads
      - ./backend/app/templates:/app/app/templates
      - ./frontend/dist:/frontend/dist
      - chroma_cache:/root/.cache/chroma
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emergency-plan-frontend
    environment:
      VITE_API_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.ts:/app/vite.config.ts
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  shuzihuayuan:
    build:
      context: ./frontend
      dockerfile: Dockerfile.mobile
    container_name: shuzihuayuan
    ports:
      - "8082:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  shuzihuayuan_pgdata:
    external: true
  chroma_cache:


